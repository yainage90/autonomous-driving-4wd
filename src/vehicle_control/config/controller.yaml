controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odom

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.1396
      stateful: true

    controller_plugins: ["follow_path"]

    follow_path:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true

      # 선속도: m/s, 각속도: rad/s
      min_vel_x: 0.0
      max_vel_x: 0.2
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.6

      # 평면 이동 속도의 크기와 회전 속도의 최소 크기
      min_speed_xy: 0.0
      max_speed_xy: 0.2
      min_speed_theta: 0.0

      # 선가속도: m/s², 각가속도: rad/s²
      acc_lim_x: 0.2
      acc_lim_y: 0.0
      acc_lim_theta: 0.6

      # 감속 한계는 음수로 지정
      decel_lim_x: -0.2
      decel_lim_y: 0.0
      decel_lim_theta: -0.6

      # 한 제어 주기 동안 도달 가능한 속도 후보 생성
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"

      # 궤적 예측 시간과 계산 간격
      sim_time: 1.5

      # 20 Hz 제어 주기에 맞춰 예측
      discretize_by_time: true
      time_granularity: 0.05

       # 예측의 첫 시간 단계에서 도달한 속도를 출력
      limit_vel_cmd_in_traj: true

      # 축별 속도 후보 개수
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20

      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.005

      # 궤적 평가 기준
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "ObstacleFootprint"
        - "PathAlign"
        - "GoalAlign"
        - "PathDist"
        - "GoalDist"

      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0